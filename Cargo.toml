[package]
name = "wasm-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "net"] }
wasmer = "=7.4.2"
wasmer-wasix = "=0.704.2"

[dev-dependencies]
tungstenite = "0.26"

[profile.dev]
debug = 0
