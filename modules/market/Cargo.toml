[package]
name = "market"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
serde_json = "1"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Newer upstream getrandom releases do not yet recognize the WASIX target.
getrandom = "=0.3.3"
